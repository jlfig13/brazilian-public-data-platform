[project]
name = "bpdp"
version = "0.1.0"
description = "Plataforma de dados públicos brasileiros: Extração, curadoria e Publicação de Tabelas em Parquet."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bpdp = "bpdp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpdp = ["sources/*/curate/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
